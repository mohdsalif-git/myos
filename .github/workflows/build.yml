name: Build MyOS Bootloader

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

jobs:
  build-bootloader:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Rust stable + UEFI and Bare-metal ELF targets ─────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi, x86_64-unknown-none

      # 3. Cache Cargo registry and build artifacts ───────────────────────
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 4. Build the kernel stub as a static-PIE ELF64 ───────────────────
      - name: Build kernel stub (release static-PIE ELF64)
        run: |
          RUSTFLAGS="-C relocation-model=pie" cargo build -p kernel-stub --target x86_64-unknown-none --release

      # 5. Generate dummy signature KERNEL.SIG (104 bytes) ──────────────
      - name: Create KERNEL.SIG detached signature
        run: |
          mkdir -p build/esp_root/EFI/MYOS
          # 4 bytes magic "MYOS" + 4 bytes version 1 (LE) + 32 bytes digest + 64 bytes sig = 104 bytes
          python3 -c '
          magic = b"MYOS"
          version = (1).to_bytes(4, "little")
          digest = b"\x00" * 32
          sig = b"\x00" * 64
          data = magic + version + digest + sig
          with open("build/esp_root/EFI/MYOS/KERNEL.SIG", "wb") as f:
              f.write(data)
          '
          ls -la build/esp_root/EFI/MYOS/KERNEL.SIG

      # 6. Build the bootloader as a UEFI PE32+ binary ───────────────────
      - name: Build bootloader (release)
        run: cargo build -p bootloader --target x86_64-unknown-uefi --release

      # 7. Create the ESP FAT32 disk image ───────────────────────────────
      # Layout (UEFI Spec §3.5.1.1 — fallback boot path):
      #   /EFI/BOOT/BOOTX64.EFI   <- firmware looks here by default
      #   /EFI/MYOS/KERNEL.ELF    <- Stage 2 kernel ELF binary
      #   /EFI/MYOS/KERNEL.SIG    <- Detached cryptographic signature
      - name: Create ESP image (64 MiB FAT32)
        run: |
          sudo apt-get install -y dosfstools mtools xorriso
          mkdir -p build
          # Create 64 MiB blank image
          dd if=/dev/zero of=build/esp.img bs=1M count=64
          # Format as FAT32
          mkfs.fat -F 32 -n "MYOS_ESP" build/esp.img
          # Create EFI directory structure
          mkdir -p build/esp_root/EFI/BOOT
          # Copy bootloader to fallback path
          cp target/x86_64-unknown-uefi/release/bootloader.efi \
             build/esp_root/EFI/BOOT/BOOTX64.EFI
          # Copy kernel ELF to /EFI/MYOS/KERNEL.ELF
          cp target/x86_64-unknown-none/release/kernel-stub \
             build/esp_root/EFI/MYOS/KERNEL.ELF
          # Copy files into FAT32 image using mcopy
          mcopy -i build/esp.img -s build/esp_root/EFI ::/EFI
          # Verify the image structure
          mdir -i build/esp.img ::/EFI/MYOS/

      # 8. Create a bootable ISO (El Torito UEFI variant) ─────────────────
      - name: Package as bootable ISO (UEFI El Torito)
        run: |
          mkdir -p build/iso_root/EFI/BOOT
          mkdir -p build/iso_root/EFI/MYOS
          cp build/esp_root/EFI/BOOT/BOOTX64.EFI build/iso_root/EFI/BOOT/BOOTX64.EFI
          cp build/esp_root/EFI/MYOS/KERNEL.ELF build/iso_root/EFI/MYOS/KERNEL.ELF
          cp build/esp_root/EFI/MYOS/KERNEL.SIG build/iso_root/EFI/MYOS/KERNEL.SIG
          # Embed the ESP image as the UEFI El Torito boot image
          cp build/esp.img build/iso_root/EFI/BOOT/bootx64.img
          xorriso -as mkisofs \
            -o build/myos-b1.iso \
            -e EFI/BOOT/bootx64.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            build/iso_root
          echo "ISO size: $(du -sh build/myos-b1.iso)"

      # 8. Upload all artifacts ──────────────────────────────────────────
      - name: Upload ESP disk image (FAT32 raw)
        uses: actions/upload-artifact@v4
        with:
          name: myos-esp-img
          path: build/esp.img
          retention-days: 30

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: myos-b1-iso
          path: build/myos-b1.iso
          retention-days: 30

      - name: Upload raw EFI binary
        uses: actions/upload-artifact@v4
        with:
          name: BOOTX64-efi
          path: target/x86_64-unknown-uefi/release/bootloader.efi
          retention-days: 30

      # 9. Quick sanity check: verify PE32+ format ────────────────────────
      - name: Verify PE32+ format
        run: |
          file target/x86_64-unknown-uefi/release/bootloader.efi
          # Must print: PE32+ executable (EFI application) x86-64
